[project]
name = "kadastre"
version = "0.1.0"
description = "Plateforme de données de référence financières : GLEIF (LEI) et ESMA FIRDS, historisées et interrogeables à une date donnée."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kadastre"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
